services:
  # =============================================================================
  # 1. Hadoop NameNode
  # =============================================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9870:9870"
    env_file:
      - ./docker/hadoop/hadoop.env
    environment:
      - CLUSTER_NAME=hospital-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - hospital-ai-network

  # =============================================================================
  # 2. Hadoop DataNode
  # =============================================================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    ports:
      - "9864:9864"
    env_file:
      - ./docker/hadoop/hadoop.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9864/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - hospital-ai-network

  # =============================================================================
  # 3. Apache Spark Master
  # =============================================================================
  spark-master:
    image: bde2020/spark-master:3.1.1-hadoop3.2
    container_name: spark-master
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "7077:7077"
      - "6066:6066"
    env_file:
      - ./docker/spark/spark.env
    environment:
      - INIT_DAEMON_STEP=spark_master_init
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - hospital-ai-network

  # =============================================================================
  # 4. Apache Spark Worker 1
  # =============================================================================
  spark-worker-1:
    image: bde2020/spark-worker:3.1.1-hadoop3.2
    container_name: spark-worker-1
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./docker/spark/spark.env
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_WEBUI_PORT=8081
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - hospital-ai-network

  # =============================================================================
  # 5. Apache Spark Worker 2
  # =============================================================================
  spark-worker-2:
    image: bde2020/spark-worker:3.1.1-hadoop3.2
    container_name: spark-worker-2
    restart: unless-stopped
    ports:
      - "8082:8081"
    env_file:
      - ./docker/spark/spark.env
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_WEBUI_PORT=8081
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - hospital-ai-network

  # =============================================================================
  # 6. Hive Metastore PostgreSQL Database
  # =============================================================================
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - hive_metastore_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hospital-ai-network

  # =============================================================================
  # 7. Apache Hive / HiveServer2
  # =============================================================================
  hive-server:
    image: bde2020/hive:2.3.2
    container_name: hive-server
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10002:10002"
    env_file:
      - ./docker/hive/hive.env
    environment:
      - SERVICE_PRECONDITION=namenode:9000 namenode:9870 datanode:9864 hive-metastore-postgresql:5432
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
      hive-metastore-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep 10000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 25s
    networks:
      - hospital-ai-network

networks:
  hospital-ai-network:
    name: hospital-ai-network
    driver: bridge

volumes:
  hadoop_namenode:
    name: hospital_hadoop_namenode
  hadoop_datanode:
    name: hospital_hadoop_datanode
  hive_metastore_db:
    name: hospital_hive_metastore_db
